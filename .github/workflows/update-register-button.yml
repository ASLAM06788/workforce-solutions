name: Update candidate register button

on:
  push:
    paths:
      - '.github/workflows/update-register-button.yml'

permissions:
  contents: write

jobs:
  update-button:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Change button text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'Register via WhatsApp →'
          new = 'Register'
          if old not in text:
              raise SystemExit('Target button text not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rename candidate registration button to Register'
          git push